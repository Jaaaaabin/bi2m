# CI. Lint, typecheck, unit tests and a budgeted production build for the
# viewer; a compile/import smoke and one recognition run for the Python
# package - both on Linux, macOS and Windows, the platforms the README
# promises; a Docker build with a smoke test of the server (Linux only). The verify_* scripts and the
# Playwright e2e harnesses (viewer/scripts/e2e/) are not run
# here yet - see CONTRIBUTING.md for running them locally.
name: ci

on:
  push:
    branches: [main, intent]
  pull_request:

# A second push to the same branch supersedes the first - no point finishing a
# build for a commit nobody will look at again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    strategy:
      # Report every platform, not just the first one to fail.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 24, not the 22 LTS: it is what this project is developed and
          # verified on, and what generated package-lock.json (npm 11). The
          # point of this job is "does what the author runs still work
          # elsewhere", so it pins the author's major. 22 also works.
          node-version: 24
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build:check
      - uses: actions/upload-artifact@v4
        # always(): a build that busts a chunk budget still produces a dist,
        # and that dist is exactly what you need to see to judge the
        # regression. if-no-files-found: ignore keeps an earlier failure (one
        # that got nowhere near writing dist/) from adding a second,
        # misleading warning on top of the real error.
        # Once per run: the bundle is the same on every platform.
        if: always() && matrix.os == 'ubuntu-latest'
        with:
          name: dist
          path: viewer/dist
          if-no-files-found: ignore
          retention-days: 7

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      # Deterministic: both pyproject.toml and uv.lock are tracked, and
      # requires-python is >=3.12, which uv provisions itself.
      - run: uv sync
      - run: uv run python -m compileall -q src scripts
      - run: uv run python scripts/recognize_intents.py --list-categories
      # The tracked example model through the whole pipeline: ifcopenshell's
      # platform build, file encodings (cp1252 on Windows) and paths.
      - run: uv run python scripts/recognize_intents.py --files example_autcon

  # The self-hosting image (README "Host with Docker"): it builds, its Python
  # environment runs the pipeline, and the server answers on the page and API.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t bi2m:ci .
      - run: docker run --rm bi2m:ci python scripts/recognize_intents.py --list-categories
      - name: Server answers
        run: |
          docker run -d --name bi2m -p 127.0.0.1:3000:3000 bi2m:ci
          for i in $(seq 1 30); do curl -sf localhost:3000/api/example-models && break; sleep 1; done
          curl -sf -o /dev/null localhost:3000/
          docker logs bi2m
