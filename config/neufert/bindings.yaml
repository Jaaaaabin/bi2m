# bi2m's binding of each Neufert rule (2026-10-28): the nine rules the Neufert QA Workbench's
# Rules pilot marks final, one registry category each (neufert/pilot.py). The card, with the
# workbench's own text and the thresholds, is rules/<RID>.yaml; this file says how the generic
# families judge it. Status: `partial: <note>` = some of the card's clauses are not judged, the
# outcomes of the rest stand; `widened: <note>` = the population is wider than the card's IF
# (the IF cannot be read off the model), so fail and warn become info; `deferred: <reason>` =
# only the scenario record is emitted, `needs` names what is missing. A check's own `widened`
# downgrades that check only (families/measure.py).
# Since 2026-10-29 the live run emits only the `scenario` selection (pilot.JUDGE is off): the
# elements each rule may concern. `select`, `checks` and `applies` stay for the parked judging.

R04:
  title: Number of steps per flight and landings for legally essential stairs
  family: measure
  rule_type: MUST/SHOULD
  level: storey
  status: 'widened: every flight on a storey at least H_STOREY high is judged; whether its stair is legally essential is not
    evaluated (no fact identifies one); the landing (K10) and its width against the flight (K20) are not judged'
  scope: storey
  select:
    class: IfcStairFlight
  checks:
  - measure: flight.risers
    param: N_MIN
    when:
      measure: element.storey_height
      param: H_STOREY
  - measure: flight.risers
    param: N_MAX
    when:
      measure: element.storey_height
      param: H_STOREY
  applies_text: Legally essential stairs on storeys at least 2.75 m high.
  scenario:
    class: IfcStair
    where:
    - measure: element.storey_height
      op: '>='
      param: H_STOREY
    related:
    - via: parts
    - via: served_storeys
      span: own
  scenario_note: the stairs on storeys as high as the card asks (a top storey has no height and is left out), with all their parts (flights, landings, railings, members) and the storeys their bodies span

R05:
  title: Width and riser/tread ratio of legally essential stairs
  family: measure
  rule_type: MUST
  level: storey
  status: 'widened: every flight is judged; whether its stair is legally essential is not evaluated, and a non-essential stair
    may legitimately be narrower (R56), so fail becomes info; the 1.25 m width of residential high-rise flats is not evaluated'
  scope: storey
  select:
    class: IfcStairFlight
  checks:
  - measure: flight.width
    param: W_MIN
  - measure: flight.riser
    param: R_MAX
  - measure: flight.tread
    param: T_MIN
  applies_text: Legally essential stairs.
  scenario:
    class: IfcStair
    related:
    - via: parts
    - via: served_storeys
      span: own
  scenario_note: every stair, with all their parts (flights, landings, railings, members) and the storeys their bodies span

R07:
  title: Door clear height and accessible clear width
  family: measure
  rule_type: MUST
  level: element
  status: 'partial: the clear height is read where a door declares it (Durchgangshöhe, Architekturlichte Höhe, ClearHeight),
    else the overall height stands in, visible in the sources; the step-free entrance clause (one entrance at least W_CLEAR
    wide without a step) is not judged'
  scope: storey
  select:
    class: IfcDoor
    prop:
      IsExternal: false
  notes: a door with no IsExternal anywhere is reported as nodata on the gate, not skipped
  checks:
  - measure: door.clear_height
    param: H_CLEAR
  - measure: door.clear_width
    param: W_CLEAR
    widened: the width applies to accessible public buildings, a scope the models do not state
  applies_text: Internal doors.
  scenario:
    class: IfcDoor
    prop:
      IsExternal: false
    related:
    - via: host_wall
  scenario_note: the internal doors (IsExternal false; a door that does not state it is left out), with the walls they sit in

R10:
  title: Natural lighting depth
  family: measure
  rule_type: TYPICAL
  level: space
  status: 'partial: the depth is measured from the room''s external windows along their facade normal (a window''s local Y,
    its wall''s normal on all 34,412 corpus windows with a wall host), the shallowest daylight face counting; a face formed by
    a curtain wall alone is not read, a room without a window is nodata, and the 12–13 m building depth is not judged'
  scope: storey
  select:
    class: IfcSpace
    use: office|open_plan_office
    exclude_role: unit.rooms
  checks:
  - measure: space.daylight_depth
    param: DL_DEPTH
  applies_text: Working rooms and offices with an external window or curtain wall.
  scenario:
    class: IfcSpace
    use: office|open_plan_office
    exclude_role: unit.rooms
    related:
    - via: windows
  scenario_note: office rooms outside dwellings, with the windows that light them

R24:
  title: 'Legally essential stairs: enclosed stairwell, exit width, doors opening into the stairwell'
  family: adjacency
  rule_type: MUST
  level: storey
  status: 'deferred: a stairwell enclosed by walls is a boundary relation (not built), and legally essential stairs are not
    identified'
  scope: storey
  needs:
  - relation:boundary
  - fact:essential_stairs
  applies_text: Main and legally essential staircases.
  scenario:
    class: IfcSpace
    use: vertical_core
    exclude_use: horizontal_circulation
    related:
    - via: doors
    - via: neighbours
  scenario_note: stairwell rooms (the enclosed staircase; a "stair hall" that is also a corridor is not one)

R25:
  title: Dimensional limits for legally essential stairs (non-residential)
  family: measure
  rule_type: MUST
  level: storey
  status: 'widened: every flight of a building with no inferred dwelling is judged; whether its stair is legally essential is
    not evaluated, and "non-residential" is read as "no dwelling inferred" (the dwelling inference finds some flats only), so
    fail becomes info; the non-essential limits are R56''s'
  scope: storey
  applies:
    class: IfcBuilding
    where:
    - measure: building.dwelling_count
      op: ==
      value: 0
  select:
    class: IfcStairFlight
  checks:
  - measure: flight.width
    param: W_ESS
  - measure: flight.riser
    param: R_ESS
  - measure: flight.tread
    param: T_ESS
  - measure: flight.risers
    param: N_MAX
  applies_text: Legally essential stairs of non-residential buildings.
  scenario:
    class: IfcStair
    where:
    - measure: element.building_dwellings
      op: ==
      value: 0
    related:
    - via: parts
    - via: served_storeys
      span: own
  scenario_note: the stairs of buildings with no inferred dwelling (unknown without a usable door graph), with all their parts (flights, landings, railings, members) and the storeys their bodies span

R43:
  title: Door type and width of emergency exits
  family: measure
  rule_type: MUST
  level: element
  status: 'widened: emergency exits are approximated by external doors (IsExternal; FireExit is tagged in 3 of 370 corpus
    models); the exit width per 150 persons is not judged (no person count per exit)'
  scope: storey
  select:
    class: IfcDoor
    prop:
      IsExternal: true
  checks:
  - measure: door.operation
    param: OP_BANNED
    negate: true
  applies_text: Doors on escape routes and exits.
  scenario:
    class: IfcDoor
    prop:
      IsExternal: true
    related:
    - via: host_wall
    - via: rooms
  scenario_note: the external doors (IsExternal true), standing in for the emergency exits the model does not mark, with the
    walls they sit in and the rooms they open into

R44:
  title: External windows of heated rooms at least double/insulating glazing
  family: classify
  rule_type: MUST
  level: element
  status: 'deferred: the glazing type (insulating or double) is not read, and heated rooms are not identified'
  scope: storey
  needs:
  - measure:glazing_type
  - fact:heated_rooms
  applies_text: External windows and curtain walls of heated rooms.
  scenario:
  - class: IfcWindow
    prop:
      IsExternal: true
    related:
    - via: host_wall
    - via: rooms
  - class: IfcCurtainWall
    prop:
      IsExternal: true
  scenario_note: external windows and curtain walls, with the walls the windows sit in and the rooms they light

R56:
  title: Minimum dimensions of non-essential (additional) stairs
  family: measure
  rule_type: MUST
  level: storey
  status: 'partial: every flight is judged although the rule addresses non-essential stairs only: an essential stair is held
    to stricter values (R05, R25), so a flight short of W_NE, R_NE or T_NE fails whichever class its stair is; the cellar and
    loft stair widths of houses with at most two storeys and the spiral-stair clause are not judged'
  scope: storey
  select:
    class: IfcStairFlight
  checks:
  - measure: flight.width
    param: W_NE
  - measure: flight.riser
    param: R_NE
  - measure: flight.tread
    param: T_NE
  applies_text: Stairs that are not legally essential.
  scenario:
    class: IfcStair
    related:
    - via: parts
    - via: served_storeys
      span: own
  scenario_note: every stair, with all their parts (flights, landings, railings, members) and the storeys their bodies span
