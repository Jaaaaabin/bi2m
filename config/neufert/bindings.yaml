  - fact:public_building
  applies_text: Barrier-free / publicly accessible buildings (MBO §50).
  scenario: null
  scenario_reason: barrier-free / publicly accessible is a building scope the models do not state

K27:
  title: Step-free access and public-building scope
  topic: accessibility
  family: route
  rule_type: MUST
  priority: ★★★
  level: storey
  status: 'deferred: step-free reachability needs lifts and ramps (rare on the corpus) and the public-building scope'
  scope: storey
  needs:
  - fact:lifts
  - fact:public_building
  applies_text: Barrier-free buildings and the public parts of publicly accessible buildings.
  scenario: null
  scenario_reason: the public parts of a publicly accessible building are a scope the models do not state

K28:
  title: Wheelchair movement space
  topic: accessibility
  family: measure
  rule_type: SHOULD
  priority: ★★★
  level: space
  status: 'deferred: free-square test needs furniture footprints; the plan''s fits_square is a disc test'
  scope: storey
  needs:
  - geom:furniture_footprints
  - geom:free_square
  applies_text: Every room in barrier-free buildings; corridors in publicly accessible buildings.
  scenario: null
  scenario_reason: barrier-free is a building scope the models do not state

K29:
  title: Barrier-free toilets
  topic: accessibility
  family: provision
  rule_type: MUST
  priority: ★★
  level: space
  status: 'deferred: barrier-free public building flag and door swing are not available'
  scope: storey
  needs:
  - fact:public_building
  - geom:door_swing
  applies_text: Barrier-free public buildings.
  scenario:
    class: IfcSpace
    use: wc|bathroom
    prop:
      HandicapAccessible: true
  scenario_note: sanitary rooms declared accessible (Pset_SpaceCommon.HandicapAccessible)

K30:
  title: Barrier-free lifts
  topic: accessibility
  family: provision
  rule_type: MUST
  priority: ★★★
  level: storey
  status: 'deferred: lifts are rare (3 of 40 local models); barrier-free lift properties unverified'
  scope: storey
  needs:
  - fact:lifts
  - fact:public_building
  applies_text: Lifts in barrier-free buildings.
  scenario:
  - class: IfcTransportElement
    use: lift
  - class: IfcSpace
    use: lift
    exclude_use: lobby|horizontal_circulation
  - class: IfcDoor
    use: lift
  scenario_note: lifts by any of the three sources; the barrier-free scope is not known

K32:
  title: Movement area beside stairs
  topic: accessibility
  family: measure
  rule_type: MUST
  priority: ★★
  level: storey
  status: 'deferred: movement area beside stairs is geometry not built'
  scope: storey
  needs:
  - geom:element_geometry
  applies_text: Barrier-free public buildings.
  scenario: null
  scenario_reason: barrier-free public building is a scope the models do not state

K33:
  title: Wheelchair passing places in long corridors
  topic: accessibility
  family: measure
  rule_type: MUST
  priority: ★★
  level: space
  status: 'deferred: corridor medial-axis length and passing-place square are geometry not built'
  scope: storey
  needs:
  - geom:free_square
  - geom:element_geometry
  applies_text: Corridors and routes in barrier-free buildings.
  scenario: null
  scenario_reason: barrier-free building is a scope the models do not state

K34:
  title: Accessible floor in multi-flat buildings
  topic: accessibility
  family: route
  rule_type: MUST
  priority: ★★
  level: zone
  status: 'deferred: needs a step-free route (lifts) and door and turning-space checks per dwelling (the dwellings exist)'
  scope: storey
  needs:
  - fact:lifts
  - geom:free_square
  applies_text: Buildings with more than two flats.
  scenario:
    class: IfcSpace
    role: unit.rooms
    where:
    - measure: element.building_dwellings
      op: '>'
      value: 2
    related:
    - via: unit_doors
  scenario_note: the rooms of inferred dwellings in a building with more than two of them (the card's N_FLATS logic)

K35:
  title: Barrier-free bathrooms in dwellings
  topic: accessibility
  family: measure
  rule_type: MUST
  priority: ★★
  level: space
  status: 'deferred: the barrier-free dwelling scope is a project input; the fixture clearances are geometry not built'
  scope: storey
  needs:
  - input:project
  - geom:free_square
  applies_text: Bathrooms in barrier-free dwellings.
  scenario:
    class: IfcSpace
    role: unit.rooms
    use: bathroom
    related:
    - via: doors
    - via: furniture
  scenario_note: bathrooms inside inferred dwellings; whether the dwelling is barrier-free is not known

K36:
  title: Living room in wheelchair users' dwellings
  topic: accessibility
  family: measure
  rule_type: MUST
  priority: ★★
  level: space
  status: 'deferred: persons per dwelling are not available (OccupancyNumber on 1 of 370 models; beds would be a proxy)'
  scope: storey
  needs:
  - fact:persons
  applies_text: Living rooms in dwellings for wheelchair users.
  scenario:
    class: IfcSpace
    role: unit.rooms
    use: living
    related:
    - via: windows
    - via: furniture

K37:
  title: Movement area widths in barrier-free dwellings
  topic: accessibility
  family: measure
  rule_type: MUST
  priority: ★★
  level: space
  status: 'deferred: movement area widths are geometry not built'
  scope: storey
  needs:
  - geom:element_geometry
  applies_text: Barrier-free dwellings.
  scenario:
    class: IfcSpace
    role: unit.rooms
    related:
    - via: furniture
      kind: bed|seat|desk
    - via: unit_doors
  scenario_note: the rooms of inferred dwellings; whether the dwelling is barrier-free is not known

K38:
  title: Escape distance
  topic: escape
  family: route
  rule_type: MUST
  priority: ★★★
  level: zone
  status: bound
  scope: storey
  select:
    class: IfcSpace
    use: living|bedroom|dining|office|meeting|dwelling|cellar
  targets:
    fact: exit_seeds
    use: vertical_core
  checks:
  - param: D_ESC
  notes: inhabited rooms = the habitable concepts plus cellar rooms; targets = rooms an external door touches plus rooms named
    as vertical circulation, a superset of the legally essential stairs; the distance is a lower bound, so a fail is sound
    and a pass optimistic
  applies_text: Inhabited rooms and basements.
  scenario:
    class: IfcSpace
    use: living|bedroom|dining|office|meeting|dwelling|cellar

K39:
  title: Two independent escape routes
  topic: escape
  family: route
  rule_type: MUST
  priority: ★★★
  level: zone
  status: 'deferred: two INDEPENDENT routes need disjoint-path search and the essential-stair fact'
  scope: storey
  needs:
  - metric:independent_routes
  - fact:essential_stairs
  applies_text: Units with at least one occupied room, on every storey.
  scenario:
    class: IfcSpace
    role: unit.rooms
    related:
    - via: unit_doors

K40:
  title: Escape windows
  topic: escape
  family: measure
  rule_type: MUST
  priority: ★★
  level: element
  status: 'partial: only the sill height is judged; the clear opening size needs lining data'
  scope: storey
  select:
    class: IfcWindow
    prop:
      FireExit: true
  checks:
  - measure: window.sill_height
    param: SILL_ESC
  applies_text: Windows used as an escape route.
  scenario:
    class: IfcSpace
    role: unit.rooms
    use: living|bedroom
    related:
    - via: windows
  scenario_note: the habitable rooms of dwellings, which need an escape window; the rule itself judges the FireExit-tagged
    windows

K41:
  title: Exit width by number of people
  topic: escape
  family: aggregate
  rule_type: MUST
  priority: ★★
  level: element
  status: 'deferred: occupancy per assembly space (OccupancyNumber on 1 of 370 models) and the exit doors of a space are not
    available'
  scope: storey
  needs:
  - fact:persons
  - select:door_rooms
  applies_text: Catering and assembly spaces.
  scenario:
    class: IfcSpace
    use: assembly_hall|canteen
    exclude_role: unit.rooms
    related:
    - via: doors
  scenario_note: assembly and catering rooms outside dwellings (a flat's dining room is not an assembly space)

K42:
  title: Fire compartments and fire compartment walls
  topic: escape
  family: measure
  rule_type: MUST
  priority: ★★★
  level: zone
  status: 'deferred: fire_compartments in egress_fire covers the door side; wall ratings absent (see fire_compartments.py)'
  scope: storey
  needs:
  - fact:wall_fire_rating
  applies_text: Larger buildings under the MBO.
  scenario:
  - class: IfcWall
    has_prop:
    - FireRating
  - class: IfcZone
    use: fire_compartment
  scenario_note: walls declaring a fire rating (14 corpus models) or zones named as fire compartments

K43:
  title: Main stairs in a continuous stairwell
  topic: escape
  family: adjacency
  rule_type: MUST
  priority: ★★★
  level: storey
  status: 'deferred: a stairwell enclosed by walls is a boundary relation, not a door relation'
  scope: storey
  needs:
  - relation:boundary
  - fact:essential_stairs
  applies_text: Main / legally essential staircases.
  scenario:
    class: IfcSpace
    use: vertical_core
    exclude_use: horizontal_circulation
    related:
    - via: doors
    - via: neighbours
  scenario_note: stairwell rooms (the enclosed staircase; a "stair hall" that is also a corridor is not one)

K44:
  title: F 30 side walls of escape corridors
  topic: escape
  family: measure
