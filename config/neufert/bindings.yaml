    units assigned to the nearest core, so "one flat per floor" may be an undercount; a lift serves the core when a lift stack
    shares a storey with it; warn becomes info; the FPF == 3 note is not evaluated'
  scope: storey
  select:
    class: IfcStair
    where:
    - measure: stair.core_flats_per_floor
      op: ==
      value: 1
    - measure: stair.core_has_lift
      op: ==
      value: 0
  checks:
  - measure: stair.core_storeys
    param: N_1F
  notes: the where conditions are the card's logic (fpf == 1 AND no lift), N_1F its threshold; every stair of the core carries
    the core's storey count
  applies_text: Multi-storey housing.
  scenario:
    class: IfcStair
    where:
    - measure: stair.core_flats_per_floor
      op: '>='
      value: 1
    related:
    - via: parts
      class: IfcStairFlight
