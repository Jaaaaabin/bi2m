    those storeys; lifts = IfcTransportElement named as a lift (12 of 13 corpus models with transport elements; the thirteenth
    has escalators); a missing lift is as often unmodelled as absent, so fail becomes info; FPF (flats per floor per core)
    is not evaluated'
