    measure: space.workstations
  checks:
  - param: A_WS
    numerator:
      select:
        class: IfcSpace
        use: office|open_plan_office
      measure: space.area
  - param: A_ADD
    numerator:
      select:
        class: IfcSpace
        use: meeting|storage|filing
      measure: space.area
  - param: A_TR
    numerator:
      select:
        class: IfcSpace
        use: horizontal_circulation|lobby
      measure: space.area
  notes: workstations = desks per room (facts.workstations, the furniture classifier shared with furniture_occupancy) or the
    room's OccupancyNumber; areas are net (Qto or footprint) where the card says gross; the building is the container, so
    one ratio per model
