# bi2m bindings for the Neufert K-rules (see docs/detectors.md "The 13 Neufert categories").
# One entry per KID. Thresholds live in rules/<KID>.yaml (verbatim from neufert_logic.md); this file says
# which Topic and family run the rule, what it selects, which measures it reads and against which params.
# status: bound | partial: <what is skipped> (info only) | deferred: <reason>. Generated 2026-10-18 from the
# cards, then hand-maintained. `scenario` (2026-10-20): the selector that finds the situation the card addresses
# (scenarios.yaml, else applies, else select); `scenario_reason` when there is none.

K01:
  title: High-rise buildings
  topic: site
  family: footprint
  rule_type: MUST
  priority: ★★★
  level: site_building
  status: 'deferred: family ''footprint'' not built'
  scope: storey
  needs:
  - family:footprint
  applies_text: Buildings for long-term human occupation. Height is measured on the facade side where the ground is lowest.
  scenario:
    class: IfcBuilding
    where:
    - measure: building.top_storey_rise
      op: '>'
      param: H_HR
  scenario_note: a building whose highest storey holding spaces rises more than H_HR above the ground storey (bi2m-ea 2026-10-20,
    1 corpus model at 25 m; roof and parapet levels do not count)

K05:
  title: Setback areas (Abstandsfläche)
  topic: site
  family: footprint
  rule_type: MUST
  priority: ★★★
  level: site_building
  status: 'deferred: project input (zoning_area_and_building_class)'
  scope: storey
  needs:
  - family:footprint
  - input:project
  - input:zoning_area_and_building_class
  applies_text: Every external wall facing a plot boundary. The state LBO can change factors and exceptions.
  scenario: null
  scenario_reason: the plot boundary is a site input the models do not carry

K06:
  title: Plot coverage ratio and floor-area ratio
  topic: site
  family: aggregate
  rule_type: CALC
  priority: ★★
  level: site_building
  status: 'deferred: project input (full_storey_definition, grz_max, gfz_max)'
  scope: storey
  needs:
  - input:project
  - input:full_storey_definition
  - input:grz_max
  - input:gfz_max
  applies_text: Only when the zoning plan sets limits. Otherwise report GRZ and GFZ.
  scenario: null
  scenario_reason: the zoning plan's limits are a project input

K07:
  title: Step-length (comfort) formula
  topic: stairs
  family: measure
  rule_type: SHOULD
  priority: ★★★
  level: storey
  status: bound
  scope: storey
  select:
    class: IfcStairFlight
  derived:
    flight.step_length: 2*flight.riser + flight.tread
  checks:
  - measure: flight.step_length
    param: STEP_MIN
  - measure: flight.step_length
    param: STEP_MAX
  applies_text: All stair flights.
  scenario:
    class: IfcStairFlight
    related:
    - via: storey

K08:
  title: Optimum pitch and riser/tread ratio
  topic: stairs
  family: measure
  rule_type: GUIDE
  priority: ★★
  level: storey
  status: bound
  scope: storey
  select:
    class: IfcStairFlight
  checks:
  - measure: flight.pitch_deg
    param: PITCH_OPT
  - measure: flight.riser
    param: R_OPT
  - measure: flight.tread
    param: T_OPT
  applies_text: All stair flights; comfort optimum.
  scenario:
    class: IfcStairFlight
    related:
    - via: storey

K09:
  title: Number of steps per run
  topic: stairs
  family: measure
  rule_type: SHOULD
  priority: ★★★
  level: storey
  status: 'widened: every stair flight is judged, the legally-essential gate is not evaluated (steps counted as risers)'
  scope: storey
  select:
    class: IfcStairFlight
  checks:
  - measure: flight.risers
    param: N_MIN
  - measure: flight.risers
    param: N_MAX
  applies_text: Legally essential stairs.
  scenario:
    class: IfcStairFlight
    related:
    - via: storey

K10:
  title: Landings
  topic: stairs
  family: provision
  rule_type: MUST
  priority: ★★★
  level: storey
  status: 'deferred: essential-stair fact and landing geometry are not available'
  scope: storey
  needs:
  - fact:essential_stairs
  - geom:element_geometry
  - geom:flight_landing
  applies_text: Legally essential stairs.
  scenario:
    class: IfcStair
    where:
    - measure: stair.core_storeys
      op: '>='
      value: 2
    related:
    - via: parts
      class: IfcSlab
    - via: served_storeys
  scenario_note: stairs connecting storeys (the landing rule applies to every legally essential stair)

K11:
  title: Essential stair width and riser/tread ratio
  topic: stairs
  family: measure
  rule_type: MUST
  priority: ★★★
  level: storey
  status: 'widened: every flight is judged against W_ESS, R_MAX and T_MIN, the legally-essential gate is not evaluated and
    a non-essential stair may legitimately be narrower (K19), so fail becomes info; W_HR (residential high-rise) is not evaluated'
  scope: storey
  select:
    class: IfcStairFlight
  checks:
  - measure: flight.width
    param: W_ESS
  - measure: flight.riser
    param: R_MAX
  - measure: flight.tread
    param: T_MIN
  applies_text: Legally essential stairs, except in residential buildings with ≤ 2 flats (K12).
  scenario:
    class: IfcStairFlight
    related:
    - via: storey

K12:
  title: Stairs for up to two flats
  topic: stairs
  family: measure
  rule_type: MUST
  priority: ★★★
  level: storey
  status: 'deferred: the dwelling count per building needs a selector over the inferred units (the flight width exists)'
  scope: storey
  needs:
  - select:dwelling_units
  applies_text: Residential buildings with no more than two flats.
  scenario:
    class: IfcStair
    where:
    - measure: element.building_dwellings
      op: '>='
      value: 1
    - measure: element.building_dwellings
      op: <=
      value: 2
    related:
    - via: parts
      class: IfcStairFlight
    - via: served_storeys
      span: own
  scenario_note: stairs of a building with one or two inferred dwellings (the card's "no more than two flats")

K13:
  title: Outside stairs and office stairs
  topic: stairs
  family: measure
  rule_type: GUIDE
  priority: ★
  level: storey
  status: bound
  scope: storey
  select:
    class: IfcStair
    prop:
      IsExternal: true
    expand: IfcStairFlight
  checks:
  - measure: flight.riser
    param: R_LO–R_HI
  - measure: flight.tread
    param: T_LO–T_HI
  applies_text: Outside stairs. Office and emergency stairs have no numeric value here.
  scenario:
    class: IfcStair
    prop:
      IsExternal: true
    expand: IfcStairFlight

K14:
  title: Spiral staircases
  topic: stairs
  family: measure
  rule_type: SHOULD
  priority: ★★
  level: storey
  status: 'deferred: the sole stair inside a dwelling needs a selector over the inferred units and the stair-in-room relation'
  scope: storey
  needs:
  - select:dwelling_units
  - relation:contains
  applies_text: Spiral stairs that are the sole connecting stair inside a house.
  scenario:
    class: IfcStair
    predefined: SPIRAL_STAIR
    where:
    - measure: stair.turn_deg
      op: '>='
      value: 270
    related:
    - via: parts
      class: IfcStairFlight
    - via: served_storeys
      span: own
  scenario_note: a SPIRAL_STAIR whose walking line turns 270 degrees or more (Revit types any stair with an arc as SPIRAL_STAIR;
    38 of 184 corpus stairs turn that far)

K15:
  title: Railing heights for galleries, mezzanines, balconies
  topic: stairs
  family: measure
  rule_type: MUST
  priority: ★★★
  level: storey
  status: 'widened: every IfcRailing is judged, the drop is approximated by the rise of the railing''s storey above the ground
    storey (DROP_HI splits H_LOW from H_HIGH on it), the 1 m compulsory-railing drop and the workplace case are not evaluated,
    and a declared Height may be the family''s imperial default (templateValue / imperialDefault flag it)'
  scope: storey
  select:
    class: IfcRailing
  checks:
  - measure: railing.height
    param: H_LOW
    when:
      measure: element.storey_rise
      param: DROP_HI
      side: below
  - measure: railing.height
    param: H_HIGH
    when:
      measure: element.storey_rise
      param: DROP_HI
      side: above
  applies_text: Galleries, mezzanines, balconies, theatre circles and any edge with a drop of at least DROP_REQ.
  scenario:
    class: IfcRailing
    related:
    - via: storey

K16:
  title: Barrier-free ramps
  topic: stairs
  family: measure
  rule_type: MUST
  priority: ★★★
  level: storey
  status: 'deferred: no barrier-free gate; Pset_RampFlightCommon carries no Slope in the template, landings and handrails
    are geometry'
  scope: storey
  needs:
  - fact:public_building
  - geom:element_geometry
  - geom:flight_landing
  - geom:railing_sides
  applies_text: Barrier-free ramps.
  scenario:
    class: IfcRamp
    related:
    - via: parts
      class: IfcRampFlight

K17:
  title: Handrails on both sides (public buildings)
  topic: stairs
  family: provision
  rule_type: MUST
  priority: ★
  level: storey
  status: 'deferred: handrails per flight side need railing geometry'
  scope: storey
  needs:
  - geom:element_geometry
  - geom:railing_sides
  applies_text: Stairs in publicly accessible buildings (MBO §50).
  scenario:
    class: IfcStair
    expand: IfcRailing
  scenario_note: the railings of stairs (handrails per flight side); the public-building scope is not known

K18:
  title: Lift waiting area
  topic: stairs
  family: measure
  rule_type: SHOULD
  priority: ★★
  level: storey
  status: 'deferred: lifts are rare (3 of 40 local models) and the waiting-area geometry is not built'
  scope: storey
  needs:
  - fact:lifts
  - geom:element_geometry
  applies_text: Lift waiting areas.
  scenario:
  - class: IfcTransportElement
    use: lift
  - class: IfcSpace
    use: lift
    exclude_use: lobby|horizontal_circulation
  scenario_note: lift cars and shaft spaces; a lift-named lobby or corridor is not the lift

K19:
  title: Non-essential stairs
  topic: stairs
  family: measure
  rule_type: MUST
  priority: ★
  level: storey
  status: bound
  scope: storey
  select:
    class: IfcStairFlight
  checks:
  - measure: flight.width
    param: W_NE
  - measure: flight.riser
    param: R_NE
  - measure: flight.tread
    param: T_NE
  notes: 'every flight is judged although the card addresses non-essential stairs only: an essential stair is held to stricter
    values (K11: 1.00 m, 0.17 / 0.28), so a flight that falls short of W_NE, R_NE or T_NE fails whichever class its stair
    is; the population is wider, the fails are sound'
  applies_text: Stairs that are not legally essential.
  scenario:
    class: IfcStairFlight
    related:
    - via: storey

K20:
  title: Landing width ≥ stair width
  topic: stairs
  family: measure
  rule_type: MUST
  priority: ★★★
  level: storey
  status: 'deferred: W_LAND is an expression param (the adjoining flight''s width) and the landing''s own width is geometry
    not built; the flight width exists'
  scope: storey
  needs:
  - op:expr
  - geom:flight_landing
  applies_text: All stairs with landings.
  scenario:
    class: IfcStair
    expand: IfcSlab
  scenario_note: stairs with landing slabs among their parts

K22:
  title: Usual door widths in housing
  topic: doors
  family: measure
  rule_type: GUIDE
  priority: ★★
  level: element
  status: 'deferred: door -> reached rooms selector (door role) not built'
  scope: storey
  needs:
  - select:door_rooms
  applies_text: Doors in housing.
  scenario:
    class: IfcDoor
    role: unit.entrance_doors
    related:
    - via: host_wall
  scenario_note: the doors of the inferred dwellings (their entrance doors; room doors inside a flat have no role yet)

K23:
  title: Clear height of internal doors
  topic: doors
  family: measure
  rule_type: MUST
  priority: ★★
  level: element
  status: 'partial: the clear passage height is read where a door declares it (Durchgangshöhe, Architekturlichte Höhe, ClearHeight:
    708 doors of 26 corpus models), else the opening''s OverallHeight stands in, visible in the sources; a pass on an overall
    height is not a measured clear height'
  scope: storey
  select:
    class: IfcDoor
    prop:
      IsExternal: false
  notes: a door with no IsExternal anywhere is reported as nodata on the gate (2026-10-20), not skipped
  checks:
  - measure: door.clear_height
    param: H_DOOR
  - measure: door.clear_height
    param: H_BETTER
  applies_text: Internal doors.
  scenario:
    class: IfcDoor
    prop:
      IsExternal: false
    related:
    - via: host_wall

K24:
  title: Door types at emergency exits
  topic: doors
  family: measure
  rule_type: MUST
  priority: ★★
  level: element
  status: 'widened: emergency exits approximated by external doors (IsExternal); FireExit is tagged in 3 of 370 corpus models'
  scope: storey
  select:
    class: IfcDoor
    prop:
      IsExternal: true
  checks:
  - measure: door.operation
    param: OP_BANNED
    negate: true
  applies_text: Emergency exits.
  scenario:
    class: IfcDoor
    prop:
      IsExternal: true
    related:
    - via: host_wall

K25:
  title: Flat front doors accessed by lift
  topic: doors
  family: measure
  rule_type: MUST
  priority: ★★
  level: element
  status: 'widened: flat entrance doors are the inferred units'' entrance doors, storeys served by a lift come from the lift
    stacks (facts.vertical_cores), and OverallWidth / OverallHeight are the opening, not the clear passage, so fail and warn
    become info'
  scope: storey
  select:
    class: IfcDoor
    role: unit.entrance_doors
    where:
    - measure: element.storey_lift_cores
      op: '>'
      value: 0
  checks:
  - measure: door.clear_width
    param: W_LIFT
  - measure: door.clear_height
    param: H_LIFT
  applies_text: Flat front doors reached by lift (MBO).
  scenario:
    class: IfcDoor
    role: unit.entrance_doors
    where:
    - measure: element.storey_lift_cores
      op: '>'
      value: 0
    related:
    - via: storey

K26:
  title: Clear width of barrier-free doors
  topic: accessibility
  family: measure
  rule_type: MUST
  priority: ★★★
  level: element
  status: 'deferred: publicly accessible / barrier-free building flag is not available on the corpus'
  scope: storey
