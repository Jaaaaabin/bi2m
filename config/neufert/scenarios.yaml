# The scenario layer of the Neufert bindings (2026-10-20): per card, the selector that finds the
# SITUATION the card addresses in a model, independent of whether the requirement itself is judged. The engine emits
# one `scenario` record per rule and model when the population is non-empty (members = the population, the status
# and the blocker in the summary), nothing when it is empty, and nothing when the scenario is `null` here: then the
# gate of the card is itself the missing fact (a high-rise, a public building, a zoning plan) and `reason` says so.
#
# A scenario must name a discriminating facet (a use concept, a role, a property gate, a predefined type, a where
# condition on a logic constant of the card, or a rare element class such as IfcRamp or IfcGrid); a bare IfcSpace or
# IfcWall finds every model and says nothing. A rule not listed here takes its `applies` selector, else its rule-level
# `select` (scripts/neufert_bindings.py). Same selector grammar as bound.yaml (select.py); a list is a union.

K01:
