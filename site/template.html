<title>Neufert QA Workbench</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: drafting-table workbench. Project rail on the left, the selected model's title block on top, redline review of QA below. */
:root {
  --paper: #f1f2ee;      /* drafting film */
  --sheet: #fbfbf8;      /* card surface */
  --ink: #1d2226;
  --ink-2: #545d62;
  --rule: #d3d7d2;
  --rule-2: #e3e6e1;
  --redline: #c22f3d;    /* review / edit accent */
  --redline-bg: #fbe9ea;
  --t1: #8a5a00;  --t1-bg: #f6ecd6;
  --t2: #2f5378;  --t2-bg: #e3ebf3;
  --ok: #2c7349;  --ok-bg: #e2f0e6;
  --flag: #a8660b; --flag-bg: #faeed9;
  --drop: #6d7478; --drop-bg: #e9ebea;
  --shadow: 0 1px 0 rgba(29,34,38,.04), 0 1px 3px rgba(29,34,38,.06);
  --f-display: "IBM Plex Sans Condensed", "PingFang SC", "Noto Sans SC", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --s-xs: 11.5px; --s-sm: 12.5px; --s-md: 14px; --s-lg: 17px; --s-xl: 22px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #14181a; --sheet: #1b2023; --ink: #e4e7e5; --ink-2: #9aa3a7; --rule: #323a3e; --rule-2: #272e31;
  --redline: #f0646f; --redline-bg: #3a1e22;
  --t1: #e2b35a; --t1-bg: #352a14; --t2: #8db6df; --t2-bg: #1b2a3a;
  --ok: #7fc99a; --ok-bg: #173022; --flag: #e8ae55; --flag-bg: #3a2c14; --drop: #9aa1a4; --drop-bg: #262c2f;
  --shadow: none; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --paper: #14181a; --sheet: #1b2023; --ink: #e4e7e5; --ink-2: #9aa3a7; --rule: #323a3e; --rule-2: #272e31;
  --redline: #f0646f; --redline-bg: #3a1e22;
  --t1: #e2b35a; --t1-bg: #352a14; --t2: #8db6df; --t2-bg: #1b2a3a;
  --ok: #7fc99a; --ok-bg: #173022; --flag: #e8ae55; --flag-bg: #3a2c14; --drop: #9aa1a4; --drop-bg: #262c2f;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: var(--s-md); line-height: 1.55; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--t2); }
:focus-visible { outline: 2px solid var(--redline); outline-offset: 2px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--rule);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 10px; padding-inline: 20px; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { font-family: var(--f-display); font-weight: 600; font-size: var(--s-lg); margin: 0; letter-spacing: .01em; }
.brand span { color: var(--ink-2); font-size: var(--s-sm); }
.tally { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: var(--s-sm); color: var(--ink-2); font-variant-numeric: tabular-nums; }
.tally b { color: var(--ink); font-weight: 600; }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.sync { font-size: var(--s-xs); padding: 2px 8px; border-radius: 99px; border: 1px solid var(--rule); color: var(--ink-2); white-space: nowrap; }
.sync.live { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 40%, transparent); }
.sync.ro { color: var(--flag); border-color: color-mix(in srgb, var(--flag) 40%, transparent); }
.btn { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: var(--s-sm); white-space: nowrap; }
.btn:hover { border-color: var(--ink-2); }
.btn.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.red { color: var(--redline); border-color: color-mix(in srgb, var(--redline) 45%, transparent); }
.btn:disabled { opacity: .45; cursor: default; }

/* shell */
.shell { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 0; min-height: calc(100vh - 60px); }
.rail { border-right: 1px solid var(--rule); padding-block: 14px; padding-inline: 12px; display: flex; flex-direction: column; gap: 4px; position: sticky; top: 58px; align-self: start; max-height: calc(100vh - 58px); overflow-y: auto; }
.rail h2 { font-family: var(--f-display); font-size: var(--s-xs); text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); margin: 6px 8px 6px; font-weight: 600; }
.pj { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 10px; align-items: center; padding: 7px 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; background: none; text-align: left; width: 100%; }
.pj:hover { background: var(--sheet); }
.pj[aria-current="true"] { background: var(--sheet); border-color: var(--rule); box-shadow: var(--shadow); }
.pj img { width: 44px; height: 44px; object-fit: cover; border-radius: 5px; background: var(--rule-2); }
.pj .nm { font-size: var(--s-sm); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pj .sub { font-size: var(--s-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: center; }
.meter { height: 3px; background: var(--rule-2); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; background: var(--ok); }

.main { padding-block: 22px 60px; padding-inline: 28px; display: flex; flex-direction: column; gap: 22px; min-width: 0; max-width: 1180px; }

/* title block */
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; box-shadow: var(--shadow); }
.dossier { display: grid; grid-template-columns: minmax(0, 1fr) 300px; }
.dossier > .info { padding: 20px 22px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.eyebrow { font-family: var(--f-display); font-size: var(--s-xs); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.pj-title { font-family: var(--f-mono); font-size: var(--s-xl); font-weight: 500; margin: 2px 0 0; word-break: break-all; }
.pj-type { font-size: var(--s-lg); margin: 2px 0 0; text-wrap: balance; }
.tb { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); border-top: 1px solid var(--rule); border-left: 1px solid var(--rule); }
.tb > div { border-right: 1px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 7px 10px; min-width: 0; }
.tb dt { font-family: var(--f-display); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.tb dd { margin: 1px 0 0; font-size: var(--s-sm); overflow-wrap: anywhere; }
.tb dd.mono { font-family: var(--f-mono); font-size: 12px; }
.shot { border-left: 1px solid var(--rule); display: flex; flex-direction: column; min-width: 0; }
.shot img { width: 100%; aspect-ratio: 9 / 10; object-fit: cover; border-top-right-radius: 10px; display: block; background: var(--rule-2); max-width: 100%; }
.shot figcaption { font-size: var(--s-xs); color: var(--ink-2); padding: 6px 12px; border-top: 1px solid var(--rule); }
.notes { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; max-width: 72ch; }
.notes li { font-size: var(--s-md); }

.duo { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 22px; }
.panel { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel h3 { margin: 0; font-family: var(--f-display); font-size: var(--s-md); font-weight: 600; }
.levels { display: flex; flex-direction: column; }
.lv { display: grid; grid-template-columns: 22px 78px minmax(0,1fr) 100px; align-items: center; gap: 8px; padding: 5px 0; border-bottom: 1px dashed var(--rule); font-variant-numeric: tabular-nums; }
.lv:last-child { border-bottom: 0; }
.lv svg { width: 14px; height: 12px; }
.lv .el { font-family: var(--f-mono); font-size: 12.5px; }
.lv .nm { font-size: var(--s-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lv .dh { display: flex; align-items: center; gap: 6px; font-size: var(--s-xs); color: var(--ink-2); font-family: var(--f-mono); justify-content: flex-end; }
.lv .dh i { display: inline-block; height: 6px; background: var(--t2); opacity: .55; border-radius: 1px; }
.counts { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 2px 14px; }
.counts div { display: flex; justify-content: space-between; gap: 8px; font-size: var(--s-sm); border-bottom: 1px solid var(--rule-2); padding: 3px 0; }
.counts span { color: var(--ink-2); }
.counts b { font-weight: 500; font-variant-numeric: tabular-nums; }
.loc { display: flex; flex-direction: column; gap: 6px; font-size: var(--s-sm); }
.loc .coord { font-family: var(--f-mono); font-size: 13px; }
.warn { display: inline-flex; gap: 6px; align-items: baseline; font-size: var(--s-xs); padding: 3px 8px; border-radius: 5px; background: var(--flag-bg); color: var(--flag); align-self: flex-start; }
.warn.site { background: var(--t2-bg); color: var(--t2); }
.muted { color: var(--ink-2); }

/* QA */
.qa-head { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.qa-head h2 { margin: 0; font-family: var(--f-display); font-size: var(--s-lg); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--rule); border-radius: 7px; overflow: hidden; background: var(--sheet); }
.seg button { border: 0; background: none; padding: 5px 12px; cursor: pointer; font-size: var(--s-sm); font-variant-numeric: tabular-nums; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select, .filters input { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 5px 8px; font-size: var(--s-sm); max-width: 100%; }
.filters input { width: 200px; }
.list { display: flex; flex-direction: column; gap: 10px; }
.empty { padding: 28px; text-align: center; color: var(--ink-2); border: 1px dashed var(--rule); border-radius: 10px; }

.qa { background: var(--sheet); border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; position: relative; }
.qa.edited { border-left: 3px solid var(--redline); }
.qa.st-drop { opacity: .6; }
.qa.st-drop .q { text-decoration: line-through; text-decoration-color: var(--drop); }
.qa.is-editing { border-color: var(--redline); box-shadow: 0 0 0 3px var(--redline-bg); }
.qa-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.qid { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); margin-right: 2px; }
.chip { font-size: 11px; padding: 1px 7px; border-radius: 4px; background: var(--rule-2); color: var(--ink-2); white-space: nowrap; }
.chip.t1 { background: var(--t1-bg); color: var(--t1); }
.chip.t2 { background: var(--t2-bg); color: var(--t2); }
.chip.ok { background: var(--ok-bg); color: var(--ok); }
.chip.flag { background: var(--flag-bg); color: var(--flag); }
.chip.drop { background: var(--drop-bg); color: var(--drop); }
.chip.red { background: var(--redline-bg); color: var(--redline); }
.chip.new { background: var(--ink); color: var(--paper); }
.q { font-weight: 600; font-size: 15px; line-height: 1.45; max-width: 90ch; overflow-wrap: anywhere; }
.a { white-space: pre-wrap; font-size: var(--s-sm); color: var(--ink); background: var(--paper); border-radius: 6px; padding: 8px 10px; overflow-wrap: anywhere; font-family: var(--f-mono); line-height: 1.5; }
.a.clamp { max-height: 9.5em; overflow: hidden; position: relative; }
.a.clamp::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.5em; background: linear-gradient(to bottom, transparent, var(--paper)); }
.more { align-self: flex-start; background: none; border: 0; padding: 0; color: var(--t2); cursor: pointer; font-size: var(--s-xs); }
.note { font-size: var(--s-sm); border-left: 2px solid var(--flag); padding: 2px 0 2px 10px; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
.orig { font-size: var(--s-xs); color: var(--ink-2); border: 1px dashed var(--rule); border-radius: 6px; padding: 8px 10px; display: flex; flex-direction: column; gap: 4px; }
.orig del { color: var(--redline); text-decoration-color: var(--redline); white-space: pre-wrap; overflow-wrap: anywhere; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.acts .who { margin-left: auto; font-size: var(--s-xs); color: var(--ink-2); }
.act { border: 1px solid var(--rule); background: none; border-radius: 5px; padding: 2px 9px; font-size: var(--s-xs); cursor: pointer; }
.act:hover { border-color: var(--ink-2); }
.act[aria-pressed="true"].ok { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.act[aria-pressed="true"].flag { background: var(--flag-bg); color: var(--flag); border-color: transparent; }
.act[aria-pressed="true"].drop { background: var(--drop-bg); color: var(--drop); border-color: transparent; }

.chip.qt { background: var(--redline-bg); color: var(--redline); }
.hx { display: grid; gap: 10px; }
.hx h4 { margin: 0 0 3px; font-family: var(--f-display); font-size: 10.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.hx ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 2px; font-size: var(--s-sm); }
.hx li { overflow-wrap: anywhere; }
.hidden-k { font-size: var(--s-sm); background: var(--t1-bg); color: var(--ink); border-radius: 6px; padding: 7px 10px; }
.hidden-k b { color: var(--t1); font-weight: 600; margin-right: 6px; }
.cite { border-left: 2px solid var(--t2); padding: 2px 0 2px 10px; font-size: var(--s-sm); }
.cite q { font-style: italic; overflow-wrap: anywhere; white-space: pre-wrap; }
.cite .src { display: block; font-size: var(--s-xs); color: var(--ink-2); font-family: var(--f-mono); margin-bottom: 1px; }
.from { font-size: var(--s-sm); color: var(--ink-2); border-left: 2px solid var(--rule); padding: 1px 0 1px 10px; overflow-wrap: anywhere; }
.from b { font-family: var(--f-mono); font-weight: 500; color: var(--ink); margin-right: 4px; }
.chip.link { cursor: pointer; border: 0; font: inherit; font-size: 11px; background: var(--redline-bg); color: var(--redline); }
.chip.sup { background: var(--t1-bg); color: var(--t1); }
.qa.flash { box-shadow: 0 0 0 3px var(--redline-bg); }
.intro { font-size: var(--s-sm); color: var(--ink-2); max-width: 80ch; margin: -8px 0 0; }
.form { display: grid; gap: 10px; }
.form label { display: flex; flex-direction: column; gap: 3px; font-size: var(--s-xs); color: var(--ink-2); font-family: var(--f-display); letter-spacing: .04em; text-transform: uppercase; font-weight: 600; }
.form textarea, .form select, .form input { text-transform: none; letter-spacing: 0; font-family: var(--f-body); font-weight: 400; color: var(--ink); border: 1px solid var(--rule); border-radius: 6px; background: var(--paper); padding: 7px 9px; font-size: var(--s-md); width: 100%; }
.form textarea.mono { font-family: var(--f-mono); font-size: 12.5px; }
.form .row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.form .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.form .err { color: var(--redline); font-size: var(--s-sm); }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 8px 14px; border-radius: 8px; font-size: var(--s-sm); z-index: 9; max-width: calc(100% - 32px); }

@media (max-width: 980px) {
  .dossier { grid-template-columns: 1fr; }
  .shot { border-left: 0; border-top: 1px solid var(--rule); flex-direction: row; }
  .shot img { width: 160px; aspect-ratio: 1; border-radius: 0 0 0 10px; }
  .shot figcaption { border-top: 0; align-self: end; }
  .duo { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; max-height: none; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding-inline: 16px; }
  .rail h2 { display: none; }
  .pj { width: auto; min-width: 190px; }
  .main { padding-inline: 16px; }
  .bar { padding-inline: 16px; }
  .form .row { grid-template-columns: 1fr; }
  .filters input { width: 100%; }
  .lv { grid-template-columns: 18px 70px minmax(0,1fr) 78px; }
}

/* pages: workbench / knowledge / results */
.pages { margin-inline: 4px; }
.page { padding-block: 22px 60px; padding-inline: 28px; display: flex; flex-direction: column; gap: 22px; max-width: 1180px; margin-inline: auto; min-width: 0; }
.page[hidden], .shell[hidden] { display: none; }
.page h2 { margin: 0; font-family: var(--f-display); font-size: var(--s-xl); font-weight: 600; }
.page h3 { margin: 0 0 4px; font-family: var(--f-display); font-size: var(--s-lg); font-weight: 600; }
.page .lede { margin: 0; max-width: 78ch; color: var(--ink-2); }
.page .lede b { color: var(--ink); }
.blk { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.blk p { margin: 0; max-width: 78ch; color: var(--ink-2); font-size: var(--s-sm); }
.scroll { overflow-x: auto; }
table.rt { border-collapse: collapse; width: 100%; font-size: var(--s-sm); font-variant-numeric: tabular-nums; }
table.rt th, table.rt td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--rule-2); white-space: nowrap; }
table.rt th { font-weight: 500; color: var(--ink-2); font-size: var(--s-xs); }
table.rt th:first-child, table.rt td:first-child { text-align: left; }
table.rt td.best { font-weight: 600; }
:root { --c-mcq: #2a78d6; --c-open: #eb6834; --c-good: #0ca30c; --c-part: #fab219; --c-bad: #c3c2b7; --c-grid: #e1e0d9; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-mcq: #3987e5; --c-open: #d95926; --c-bad: #52514e; --c-grid: #2c2c2a; } }
:root[data-theme="dark"] { --c-mcq: #3987e5; --c-open: #d95926; --c-bad: #52514e; --c-grid: #2c2c2a; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: var(--s-xs); color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.bars { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 10px 12px; align-items: center; font-size: var(--s-sm); }
.bars .nm { white-space: nowrap; }
.bars .track { display: grid; gap: 2px; background: linear-gradient(to right, var(--c-grid) 1px, transparent 1px) 0 0 / 25% 100%; border-right: 1px solid var(--c-grid); }
.bars .bar { height: 12px; border-radius: 0 4px 4px 0; position: relative; min-width: 2px; }
.bars .bar span { position: absolute; left: 100%; top: 50%; transform: translateY(-50%); margin-left: 6px; font-size: var(--s-xs); color: var(--ink-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.bars .track.pad { padding-right: 0; margin-right: 44px; }
.stack { display: flex; gap: 2px; height: 16px; margin-right: 0; }
.stack i { display: block; height: 100%; min-width: 2px; }
.stack i:first-child { border-radius: 4px 0 0 4px; } .stack i:last-child { border-radius: 0 4px 4px 0; }
.stack-row { display: grid; gap: 3px; }
.stack-row small { color: var(--ink-2); font-size: var(--s-xs); font-variant-numeric: tabular-nums; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.kpi { padding: 14px 16px; }
.kpi b { display: block; font-family: var(--f-display); font-size: 28px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi span { font-size: var(--s-xs); color: var(--ink-2); }
.hardlist { display: grid; gap: 6px; font-size: var(--s-sm); }
.hardlist button { all: unset; cursor: pointer; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 8px; padding: 6px 8px; border-radius: 6px; }
.hardlist button:hover { background: var(--rule-2); }
.hardlist button:focus-visible { outline: 2px solid var(--redline); }
.hardlist .kid, .kcard .kid { font-family: var(--f-mono); font-size: var(--s-xs); color: var(--ink-2); }
.hardlist small { color: var(--ink-2); display: block; }
.kcard { scroll-margin-top: 110px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }

<script>
const DATA = /*__DATA__*/null;
// ---------- language (zh / en) ----------
let lang = 'zh';
try { const s = localStorage.getItem('nqa.lang'); if (s === 'en' || s === 'zh') lang = s; } catch (e) {}
const L = (zh, en) => lang === 'en' ? en : zh;
const EN = DATA.en || {};
const D = s => (lang === 'en' && EN[s]) || s;                      // project descriptions
const KT = k => (lang === 'en' && k.title_en) || k.title;          // knowledge point title / summary / topic
const KS = k => (lang === 'en' && k.summary_en) || k.summary;
const TP = t => (lang === 'en' && (DATA.topics_en || {})[t]) || t;
const mk_TOPIC = () => ({
  T1_escape_accessibility: L('疏散 / 无障碍', 'Escape / accessibility'), T1_occupancy_program_ratios: L('人数 / 面积比', 'Occupancy / area ratios'), T1_layout_typology: L('户型 / 布局', 'Layout / typology'),
  T1_parking: L('停车', 'Parking'), T1_stair_spec_grid: L('楼梯规格 / 柱网', 'Stair spec / grid'),
  T2_room_program: L('房间配置', 'Room programme'), T2_door_widths: L('门宽', 'Door widths'), T2_window_sizes: L('窗尺寸', 'Window sizes'), T2_ceiling_heights: L('室内净高', 'Ceiling heights'),
  T2_storey_heights: L('层高', 'Storey heights'), T2_stairs_railings: L('楼梯 / 栏杆', 'Stairs / railings'), T2_furniture_in_room: L('房间家具', 'Furniture in rooms'), T2_space_use_by_function: L('功能面积分配', 'Space use by function')
});
const mk_CAT = () => ({ 1: L('1 直接检索', '1 Direct retrieval'), 2: L('2 计算聚合', '2 Computation / aggregation'), 3: L('3 几何/空间', '3 Geometry / spatial'), 4: L('4 信息不全', '4 Incomplete information') });
const mk_TIER = () => ({ tier1: L('一层 · 需 Neufert 知识', 'Tier 1 · needs Neufert knowledge'), tier2: L('二层 · 尺寸可对照', 'Tier 2 · dimensions comparable') });
const mk_STATUS = () => ({ ok: L('已确认', 'Confirmed'), flag: L('有问题', 'Flagged'), drop: L('剔除', 'Dropped') });
const mk_COUNT_LABEL = () => ({ Space: L('房间', 'Spaces'), Wall: L('墙', 'Walls'), Door: L('门', 'Doors'), Window: L('窗', 'Windows'), Slab: L('楼板', 'Slabs'), Stair: L('楼梯', 'Stairs'), Railing: L('栏杆', 'Railings'), Column: L('柱', 'Columns'), Beam: L('梁', 'Beams'),
  CurtainWall: L('幕墙', 'Curtain walls'), Roof: L('屋顶', 'Roofs'), Covering: L('面层', 'Coverings'), FurnishingElement: L('家具', 'Furniture'), SanitaryTerminal: L('洁具', 'Sanitary') });
const EDIT_FIELDS = ['question', 'ground_truth', 'category', 'neufert_tier', 'neufert_topic'];

const mk_QTYPE = () => ({ compliance: L('合规判断', 'Compliance'), diagnosis: L('诊断', 'Diagnosis'), derivation: L('推算', 'Derivation'), intent: L('设计意图', 'Design intent') });
let TOPIC, CAT, TIER, STATUS, COUNT_LABEL, QTYPE;
function setDicts() { TOPIC = mk_TOPIC(); CAT = mk_CAT(); TIER = mk_TIER(); STATUS = mk_STATUS(); COUNT_LABEL = mk_COUNT_LABEL(); QTYPE = mk_QTYPE(); }
setDicts();
const HARD_FIELDS = ['question', 'answer', 'hidden_knowledge', 'rubric', 'question_type'];
const P = Object.fromEntries(DATA.projects.map(p => [p.id, p]));
const ORIG = Object.fromEntries(DATA.qa.map(q => [q.id, q]));
const HORIG = Object.fromEntries((DATA.hard || []).map(h => [h.hid, h]));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const state = { project: DATA.projects[0].id, scope: 'neufert', topic: '', status: '', q: '', editing: null, expanded: new Set(), showOrig: new Set() };
let edits = {};            // docId -> body
let db = null, user = null, canWrite = false, myId = null, names = {};

function fromHash() { const h = decodeURIComponent(location.hash.slice(1)); if (P[h]) state.project = h; }
fromHash();
try { const s = localStorage.getItem('nqa.scope'); if (s === 'all' || s === 'neufert' || s === 'hard') state.scope = s; } catch (e) {}

const docIdOf = id => typeof id === 'number' ? 'q' + id : id;

// merged view of every QA (originals + edits + new)
function merged() {
  const out = [];
  for (const o of DATA.qa) {
    const e = edits['q' + o.id];
    const m = { ...o, key: o.id, status: '', note: '', edited: false, isNew: false, by: null, at: null };
    if (e) {
      for (const f of EDIT_FIELDS) if (e[f] !== undefined) m[f] = e[f];
      m.status = e.status || ''; m.note = e.note || ''; m.by = e.by || null; m.at = e.at || null;
      m.edited = EDIT_FIELDS.some(f => e[f] !== undefined && e[f] !== o[f]);
    }
    out.push(m);
  }
  for (const [k, e] of Object.entries(edits)) {
    if (!e.is_new) continue;
    out.push({ id: null, key: k, project: e.project, question: e.question || '', ground_truth: e.ground_truth || '', category: e.category || 4,
      split: '', neufert_tier: e.neufert_tier || '', neufert_topic: e.neufert_topic || '', status: e.status || '', note: e.note || '',
      edited: true, isNew: true, by: e.by || null, at: e.at || null });
  }
  return out;
}

function mergedHard() {
  return (DATA.hard || []).map(o => {
    const e = edits['h-' + o.hid];
    const m = { ...o, key: 'h-' + o.hid, hard: true, status: '', note: '', edited: false, isNew: false, by: null, at: null };
    if (e) {
      for (const f of HARD_FIELDS) if (e[f] !== undefined) m[f] = e[f];
      m.status = e.status || ''; m.note = e.note || ''; m.by = e.by || null; m.at = e.at || null;
      m.edited = HARD_FIELDS.some(f => e[f] !== undefined && !same(e[f], o[f]));
    }
    return m;
  });
}

    `把知识库里的知识点改写成 <b>context → 设计要求</b> 的规则：作用在哪类 IFC 实体上（entity）、进入规则的前提（match）、要从模型推导的变量（derive）、触发条件（IF）和参数化的要求（THEN）。<b>${RULES.length}</b> 条规则，由 <b>${nk}</b> 个知识点改写而来，<b>${nq}</b> 条原文全部与 Neufert 文本逐字核对。R48 起的规则多了两项：<b>grounding</b>——match / IF 里每个抽象概念（“必要楼梯”“疏散走廊”“一户”）在图上怎么读出来；<b>context 具体程度</b>——direct（IFC 属性就有）/ derived（抽取器从几何、关系算）/ external（IFC 没有，要靠 model card）。规则下面是它在各模型里的实例：${models.map(m => `<b>${esc(m)}</b>（${nmap(m)} 条）`).join('、')}——context 具体对应哪些实体、推导出的数值、判定和证据。当前显示 <b>${vis.length}</b> 条。`,
    `Knowledge points rewritten as <b>context → requirement</b> rules: the IFC entity the rule acts on (entity), the preconditions (match), the variables derived from the model (derive), the trigger (IF) and the parameterised requirement (THEN). <b>${RULES.length}</b> rules from <b>${nk}</b> knowledge points; all <b>${nq}</b> quotes checked verbatim against the Neufert text. From R48 on each rule also carries <b>grounding</b> (how every abstract concept in match / IF, such as "essential stair" or "escape corridor", is read off the graph) and a <b>context concreteness</b>: direct (an IFC attribute), derived (computed by the extractor from geometry or relations) or external (not in IFC, needs the model card). Below each rule are its instances in ${models.map(m => `<b>${esc(m)}</b> (${nmap(m)} rules)`).join(', ')}: which entities the context maps to, the derived values, the verdict and the evidence. Showing <b>${vis.length}</b>.`);
  rFilters(); rvCount();
  let lv = null;
  $('#r-list').innerHTML = vis.map(r => {
    let h = '';
    if (r.level !== lv) { lv = r.level; const d = LEVELS.find(l => l[0] === lv);
      h = `<div class="lvhead"><h3>${esc(lv)}</h3><span>${esc(d ? L(d[1], d[4] || d[1]) : '')} · ${vis.filter(x => x.level === lv).length}</span></div>`; }
    return h + rCard(r);
  }).join('') || ('<div class="empty">' + L('没有符合筛选条件的规则。', 'No rules match the filters.') + '</div>');
  $('#r-repr').innerHTML = L(`<h3>context 用什么表达？</h3>
    <p>三个候选：原始 IFC、ifcJSON、图。试点的结论是<b>图作为规则匹配层，IFC 作为事实来源，中间一个固定的抽取器</b>；不用 ifcJSON。</p>
    <ul>
      <li><b>原始 IFC 的问题是密度和缺失，不是格式。</b>这个模型 13 MB 里 828 个 IfcMember + 453 个 IfcPlate 是幕墙杆件，和任何规则无关；而规则真正需要的关系（房间邻接、房间里有什么、哪面墙是外墙）要么没导出，要么要跑几何才有。模型里没有 IfcRelSpaceBoundary、IfcZone、IfcGrid，材料是没有厚度的 IfcMaterialConstituentSet。</li>
      <li><b>ifcJSON 只是换了语法</b>，1:1 对应实体和 #123 引用，密度和缺失一个都没解决。</li>
      <li><b>图合适，因为规则的 context 本身就是子图模式</b>：规则 = 模式 + 对绑定变量的条件，实例 = 一次匹配的绑定。知识库已经按 BOT 分层，BOT 本身就是图本体。</li>
    </ul>
    <pre>R06  (Railing)-[:IN_STOREY]->(Storey{elev}) , (Storey)-[:ABOVE]->(Storey{elev'})   → drop
R09  (Space{function:office})-[:CONTAINS]->(Furniture{kind:desk})                      → n_ws
R08  (Wall{external})-[:HAS_MATERIAL]->(Material{category})                            → has_insulation
R10  (Space)-[:BOUNDED_BY]->(Wall|CurtainWall{external})                               → 采光面
R04  (Stair)-[:AGGREGATES]->(StairFlight{n_riser}) , (Stair)-[:AGGREGATES]->(Slab{LANDING})</pre>
    <ul>
      <li><b>节点</b>只保留规则会碰到的实体类型，带 GlobalId、规则用到的少数属性和包围盒；幕墙杆件、面板、洞口不进图。</li>
      <li><b>边</b>：IFC 现成的（containedIn, aggregates, hasMaterial, hasType）直接搬；IFC 没有但规则需要的（space CONTAINS furniture, space BOUNDED_BY wall, storey ABOVE storey）由抽取器从几何推导，标 <code>source: derived</code>。建筑用途等 IFC 没有的从 model_card 注入，标 <code>source: model_card</code>。</li>
      <li><b>给 LLM 的输入</b>不是整张图，而是按规则 context 切出来的子图卡片，也就是上面每个实例里“context 在模型里是什么”那一栏——现在是手写的，下一步由抽取器自动生成。</li>
      <li>附带好处：“哪些知识在哪些模型上可检查”变成“模式在图上有没有非空匹配”，可以自动算，取代知识库里手工维护的 models 字段。</li>
      <li>保留意见：若最终要探测 LLM 能否直接读 BIM，原始 IFC 片段仍可作对照组——同一组实例分别喂子图卡片和 IFC 片段，比准确率。</li>
    </ul>
    <p><b>抽取器已经有了第一版</b>（<code>rules/extract_graph.py</code>）：节点 = 规则会碰到的实体（场地、建筑、楼层、房间、楼梯及梯段、门窗、墙、板、柱、电梯、家具、洁具、分区、轴网），带名称、相关 Pset / Qto、材料层和世界坐标包围盒；边 = IFC 现成的 containedIn / partOf / hasType / fillsOpeningIn（标 <code>source: ifc</code>）加几何推导的 space CONTAINS furniture、door OPENS-TO space、stair SERVES storey（标 <code>source: derived</code>）。在 ifc4_0204（16 MB，Revit 25 导出）上 81 秒得到 2270 个节点、6717 条边；上面 ifc4_0204 的每个实例都是从这张图读出来的，房间面积用网格体积 ÷ 高度算（这个导出没有 Qto）。</p>
    <p>映射 0204 时暴露的 <b>context 落地问题</b>，也是规则表里 grounding 一栏要解决的：“疏散走廊”在这个模型里是一个 600 m² 的环形 Hall，不是细长房间；“工位”要数 Furniture_Desk；“电梯”是 17 个 IfcBuildingElementProxy 而不是 IfcTransportElement；“使用单元”“建筑用途”“地块边界”IFC 根本没有。所以每条规则现在都标了 context 是 direct / derived / external 的哪一种：external 的那部分（用途、人数、地块）要么从 model card 来，要么实例只能写 unknown。</p>
    <p>下一步：把 grounding 写成可执行的图模式，让规则 × 图自动匹配出实例表（现在 0204 的 103 条实例仍是读图后手写的）；对 370 个模型批量跑抽取器，先按“哪些模式有非空匹配”筛出适合哪组规则的模型；再从实例生成 compliance / diagnosis / intent 三类题。完整说明见 <code>rules/PILOT.md</code>。</p>`,
  `<h3>How should the context be represented?</h3>
    <p>Three candidates: raw IFC, ifcJSON, a graph. The pilot's conclusion: <b>a graph as the rule-matching layer, IFC as the source of facts, and a fixed extractor in between</b>; not ifcJSON.</p>
    <ul>
      <li><b>Raw IFC fails on density and omissions, not on syntax.</b> Of this 13 MB model, 828 IfcMember + 453 IfcPlate are curtain-wall mullions and panels that no rule cares about, while the relations the rules do need (room adjacency, what is in a room, which wall is external) are either not exported or need geometry. The model has no IfcRelSpaceBoundary, IfcZone or IfcGrid, and its materials are IfcMaterialConstituentSets without thicknesses.</li>
      <li><b>ifcJSON only changes the syntax</b>: 1:1 entities and #123 references, so neither the density nor the omissions are solved.</li>
      <li><b>A graph fits because a rule's context already is a subgraph pattern</b>: rule = pattern + conditions on the bound variables, instance = one binding of the match. The knowledge base is already layered after BOT, which is itself a graph ontology.</li>
    </ul>
    <pre>R06  (Railing)-[:IN_STOREY]->(Storey{elev}) , (Storey)-[:ABOVE]->(Storey{elev'})   → drop
R09  (Space{function:office})-[:CONTAINS]->(Furniture{kind:desk})                      → n_ws
R08  (Wall{external})-[:HAS_MATERIAL]->(Material{category})                            → has_insulation
R10  (Space)-[:BOUNDED_BY]->(Wall|CurtainWall{external})                               → daylight face
R04  (Stair)-[:AGGREGATES]->(StairFlight{n_riser}) , (Stair)-[:AGGREGATES]->(Slab{LANDING})</pre>
    <ul>
      <li><b>Nodes</b>: only the entity types rules touch, each with its GlobalId, the few properties rules use, and a bounding box; mullions, panels and openings stay out.</li>
      <li><b>Edges</b>: those IFC already has (containedIn, aggregates, hasMaterial, hasType) are copied; those rules need but IFC lacks (space CONTAINS furniture, space BOUNDED_BY wall, storey ABOVE storey) are derived from geometry by the extractor and tagged <code>source: derived</code>. Building-level facts IFC does not hold (usage, public access) come from the model card, tagged <code>source: model_card</code>.</li>
      <li><b>What the LLM sees</b> is not the whole graph but a subgraph card cut out by the rule's context, i.e. the "context in this model" column of each instance above, hand-written for now and to be generated by the extractor next.</li>
      <li>Side benefit: "which knowledge points can be checked on which models" becomes "does the pattern have a non-empty match on that graph", which can be computed instead of maintained by hand in the knowledge base's models field.</li>
      <li>Caveat: if the goal is to probe whether an LLM can read BIM directly, raw IFC excerpts remain useful as a control: feed the same instances once as subgraph cards and once as IFC excerpts and compare accuracy.</li>
    </ul>
    <p><b>The extractor exists now</b> (<code>rules/extract_graph.py</code>): nodes = the entities rules touch (site, building, storeys, spaces, stairs and flights, doors, windows, walls, slabs, columns, lifts, furniture, sanitary terminals, zones, grids) with names, the relevant Psets / Qtos, material layers and a world-coordinate bounding box; edges = IFC's own containedIn / partOf / hasType / fillsOpeningIn (<code>source: ifc</code>) plus geometry-derived space CONTAINS furniture, door OPENS-TO space, stair SERVES storey (<code>source: derived</code>). On ifc4_0204 (16 MB, Revit 25 export) it yields 2270 nodes and 6717 edges in 81 s; every ifc4_0204 instance above was read off that graph, with room areas computed as mesh volume ÷ height because this export carries no Qto.</p>
    <p>Mapping 0204 exposed the <b>grounding problem</b> the new grounding column addresses: the "escape corridor" here is a 600 m² ring-shaped Hall, not a narrow room; "workstations" have to be counted as Furniture_Desk; the "lifts" are 17 IfcBuildingElementProxy, not IfcTransportElement; "use unit", "building usage" and "plot boundary" are simply absent from IFC. Hence every rule now states whether its context is direct, derived or external: the external part (usage, headcount, plot) either comes from the model card or the instance has to say unknown.</p>
    <p>Next: turn grounding into executable graph patterns so rules × graphs produce the instance table automatically (the 103 instances on 0204 are still written by hand after reading the graph); run the extractor over all 370 models and select, by which patterns have non-empty matches, which models suit which rule groups; then generate compliance / diagnosis / intent questions from the instances. Full write-up in <code>rules/PILOT.md</code>.</p>`);
}
