    <!-- Fixed Sidebar Panel (a landmark: the page's controls) -->
    <aside id="sidebar-panel" aria-label="Controls">
      <!-- ONE COLUMN, ONE MODE (2026-09-24, owner's decision). This panel used
         to have two forms - a 200px expanded one and a 44px collapsed one,
         switched by #sidebar-collapse-btn, with the "Controls" heading and the
         transparency slider hidden in the narrow form. Only the narrow form is
         left: 44px wide, every control stacked in a single column, and the
         transparency slider turned on its side so it still fits (see
         .styled-range.is-vertical in style.css). The heading went with the
         toggle - this <aside>'s own aria-label already names the region, so a
         screen reader loses nothing. .sidebar-buttons-group is what puts a gap
         between clusters of buttons; it was called a "row" while there was a
         wide mode in which the buttons really did sit side by side. -->
      <div class="sidebar-buttons">
        <div class="sidebar-buttons-group">
          <!-- Theme is the first button in the column (owner, 2026-09-24). -->
          <button id="theme-toggle-btn" title="Theme" aria-label="Theme">
            <svg class="icon" id="theme-toggle-icon" aria-hidden="true">
              <use href="#icon-dark_mode"></use>
            </svg>
          </button>
          <!-- <button id="manual-refresh-btn" title="Manually refresh highlights">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none">
            <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6a6 6 0 01-6 6v2c4.42 0 8-3.58 8-8s-3.58-8-8-8zm-6 6a6 6 0 016-6V2c-4.42 0-8 3.58-8 8s3.58 8 8 8v-2a6 6 0 01-6-6z" fill="#33363F"/>
          </svg>
        </button> -->
          <!-- New Bulk Upload icon-only button -->
          <button id="bulk-upload-btn" title="Upload" aria-label="Upload">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path d="M5 20h14v-2H5v2zm7-18L5.33 9h3.84v4h4.66V9h3.84L12 2z" fill="currentColor" />
            </svg>
          </button>
        </div>
        <!-- The two "open a model from the server" buttons (2026-09-23):
             Examples and the IFC library, which opens #library-models-flyout -
             page/libraryModels.js and vite.config.js's /api/library-models.
             Read-only: never uploads, tiles or runs. -->
        <div class="sidebar-buttons-group">
          <!-- Loads one of this server's data/test_*.ifc example models directly -
             for when the browser is reached over an SSH port-forward and the
             file picker above can only see the client machine's own files. -->
          <button id="example-models-btn" title="Examples" aria-label="Examples">
            <svg class="icon" aria-hidden="true"><use href="#icon-cloud"></use></svg>
          </button>
          <button id="library-models-btn" title="Library" aria-label="Library">
            <svg class="icon" aria-hidden="true"><use href="#icon-database"></use></svg>
          </button>
        </div>
        <!-- Last in the upper part (owner, 2026-09-24): a display preference,
             not a way of getting a model in, so it closes the top block rather
             than sitting among the buttons that open one. Intent + camera
             panels open by default (on = also opens them in every viewer now).
             Decided 2026-09-20. -->
        <div class="sidebar-buttons-group">
          <button
            id="panels-default-btn"
            title="Auto-open Camera + Intents"
            aria-label="Auto-open Camera + Intents"
          >
            <svg class="icon" aria-hidden="true"><use href="#icon-view_sidebar"></use></svg>
          </button>
        </div>
      </div>

      <!-- Global Transparency Control (0-100%), vertical since 2026-09-24:
           0% at the BOTTOM, 100% at the top, at most a fifth of the panel's
           height. The label is there for the `for`/`id` pairing and the
           screen reader, not for the eye - 32px of usable width has no room
           for the word, so the live percentage below the track is the whole
           visible caption. #sidebar-content keeps its id: it is what pins
           this and the buttons under it to the bottom of the column. -->
      <div id="sidebar-content">
        <div class="transparency-slider">
          <label for="global-opacity-slider" class="visually-hidden">Transparency</label>
          <input
            type="range"
            id="global-opacity-slider"
            class="styled-range is-vertical"
            min="0"
            max="100"
            value="0"
          />
          <span id="transparency-value" class="transparency-value">0%</span>
        </div>
      </div>

      <!-- Viewer management, at the foot of the column (owner, 2026-09-24):
           add and remove a tile, then sync every tile's camera and match every
           tile's size. All four act on the SET of open viewers rather than on
           any one model, which is why they sit apart from the buttons above. -->
      <div class="sidebar-buttons sidebar-buttons-bottom">
        <div class="sidebar-buttons-group">
          <button id="add-viewer-btn" title="Add viewer" aria-label="Add viewer">+</button>
          <button id="remove-viewer-btn" title="Remove viewer" aria-label="Remove viewer">−</button>
          <button id="sync-cam-btn" title="Sync cameras" aria-label="Sync cameras">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
            >
              <path
                fill-rule="evenodd"
                clip-rule="evenodd"
                d="M20.7703 12C20.7703 11.6412 20.5762 11.4056 20.188 10.9343C18.768 9.21014 15.6357 6 12 6C8.36428 6 5.23207 9.21014 3.81198 10.9343C3.42382 11.4056 3.22974 11.6412 3.22974 12C3.22974 12.3588 3.42382 12.5944 3.81198 13.0657C5.23207 14.7899 8.36428 18 12 18C15.6357 18 18.768 14.7899 20.188 13.0657C20.5762 12.5944 20.7703 12.3588 20.7703 12ZM12 15C13.6569 15 15 13.6569 15 12C15 10.3431 13.6569 9 12 9C10.3432 9 9.00002 10.3431 9.00002 12C9.00002 13.6569 10.3432 15 12 15Z"
                fill="currentColor"
              />
            </svg>
          </button>
          <button id="match-sizes-btn" title="Match sizes" aria-label="Match sizes">
            <svg class="icon" aria-hidden="true"><use href="#icon-aspect_ratio"></use></svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main Content (grid column 2 - see style.css) -->
    <main class="app-main">
      <h1>Viewer</h1>
      <div id="viewer-wrapper">
        <div id="viewerContainer1" class="viewer-container"></div>
      </div>
    </main>

    <!-- Element Inspector (React island - see inspector/InspectorPanel.jsx).
       React mounts here; the panel itself renders into the clicked tile's
       .viewer-inspector-slot. Not loaded eagerly - see inspector/bootstrap.js,
       which dynamically imports it on first element selection instead of
       paying for React on every page load. -->
    <div id="inspector-root"></div>

    <!-- Popover for #example-models-btn - a sibling of #sidebar-panel (not
       nested inside it) so its position:fixed placement (set in JS from the
       button's own bounding rect) never gets clipped by the sidebar's own
       overflow-x:hidden. -->
    <div id="example-models-flyout" class="example-models-flyout" hidden></div>
    <!-- Popover for #library-models-btn - same placement rules as the example
       flyout above (body-level, positioned in JS from the button's rect). -->
    <div id="library-models-flyout" class="library-models-flyout" hidden></div>

    <!-- JavaScript -->
    <script type="module" src="ThatOpenCompanyLoader.js"></script>
    <script type="module" src="inspector/bootstrap.js"></script>
  </body>
</html>
